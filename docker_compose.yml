services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checklists_app
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/checklists
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "5000:5000"
    volumes:
      - appdata:/app/data
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: postgres_checklists
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: checklists
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      # Привязка только к localhost: наружу порт БД не выставляем
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  appdata:
  pgdata:
